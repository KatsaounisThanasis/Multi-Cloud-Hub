[tool.black]
line-length = 120
target-version = ["py311"]
extend-exclude = '''
/(
  | venv
  | \.venv
  | build
  | dist
  | frontend-v3
  | terraform
)/
'''

[tool.isort]
profile = "black"
line_length = 120
skip = ["venv", ".venv", "build", "dist", "frontend-v3", "terraform"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = true
no_implicit_optional = true
# Pragmatic baseline: type-check without forcing full annotation coverage yet.
check_untyped_defs = false
disallow_untyped_defs = false
exclude = "(venv|\\.venv|build|dist|frontend-v3|terraform|tests)/"
