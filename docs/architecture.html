<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Cloud-Hub · Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Multi-Cloud-Hub</p>
    <h1>Control Plane Topology</h1>

    <svg viewBox="0 0 1024 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc">
      <title id="architecture-title">Multi-Cloud-Hub Architecture</title>
      <desc id="architecture-desc">Architecture diagram showing requests moving from User to React SPA, hitting the FastAPI control plane which triggers Terraform to provision Azure and GCP infrastructure.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- Zone: Control Plane (drawn before arrows and nodes) -->
        <rect x="416" y="80" width="400" height="248" rx="8"
              fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="424" y="84" width="84" height="12" rx="2" fill="#f5f5f5"/>
        <text x="466" y="93" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.14em">CONTROL PLANE</text>

        <!-- Arrows -->
        <line x1="168" y1="272" x2="240" y2="272" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <line x1="368" y1="272" x2="440" y2="272" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        
        <!-- FastAPI to Auth (Vertical Up) -->
        <line x1="504" y1="240" x2="504" y2="184" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        
        <!-- FastAPI to Terraform Runner -->
        <line x1="568" y1="272" x2="640" y2="272" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Terraform Runner to Azure (Elbow) -->
        <path d="M 784,256 H 814 Q 822,256 822,248 V 200 Q 822,192 830,192 H 860"
              fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
              
        <!-- Terraform Runner to GCP (Elbow) -->
        <path d="M 784,288 H 814 Q 822,288 822,296 V 344 Q 822,352 830,352 H 860"
              fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

        <!-- Arrow labels -->
        <!-- User -> React -->
        <rect x="180" y="252" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="204" y="262" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HTTPS</text>

        <!-- React -> FastAPI -->
        <rect x="380" y="252" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="404" y="262" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REST API</text>

        <!-- FastAPI -> Auth -->
        <rect x="514" y="206" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="538" y="215" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VALIDATE</text>

        <!-- FastAPI -> Terraform -->
        <rect x="580" y="252" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="604" y="262" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXEC</text>

        <!-- Terraform -> Azure -->
        <rect x="760" y="218" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="784" y="227" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APPLY</text>

        <!-- Terraform -> GCP -->
        <rect x="760" y="314" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="784" y="323" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APPLY</text>

        <!-- Node: Admin / User -->
        <rect x="40" y="240" width="128" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="240" width="128" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <rect x="48" y="248" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
        <text x="62" y="257" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USR</text>
        <text x="104" y="276" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Admin / User</text>
        <text x="104" y="292" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Browser</text>

        <!-- Node: React SPA -->
        <rect x="240" y="240" width="128" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="240" y="240" width="128" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="248" y="248" width="24" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="260" y="257" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UI</text>
        <text x="304" y="276" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">React SPA</text>
        <text x="304" y="292" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Dashboard</text>

        <!-- Node: FastAPI (Focal) -->
        <rect x="440" y="240" width="128" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="440" y="240" width="128" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <rect x="448" y="248" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
        <text x="462" y="257" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
        <text x="504" y="276" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">FastAPI Server</text>
        <text x="504" y="292" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Core Backend</text>

        <!-- Node: Auth & Validations -->
        <rect x="440" y="120" width="128" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="440" y="120" width="128" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="448" y="128" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
        <text x="462" y="137" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SEC</text>
        <text x="504" y="156" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Validations</text>
        <text x="504" y="172" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Auth &amp; Reserved</text>

        <!-- Node: Terraform Runner -->
        <rect x="640" y="240" width="144" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="640" y="240" width="144" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="648" y="248" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="662" y="257" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">IAC</text>
        <text x="712" y="276" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Terraform Runner</text>
        <text x="712" y="292" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">HCL Provisioning</text>

        <!-- Node: Azure -->
        <rect x="860" y="160" width="128" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="860" y="160" width="128" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="868" y="168" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
        <text x="882" y="177" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLD</text>
        <text x="924" y="196" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Microsoft Azure</text>
        <text x="924" y="212" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">VNet · ACR · Storage</text>

        <!-- Node: GCP -->
        <rect x="860" y="320" width="128" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="860" y="320" width="128" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="868" y="328" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
        <text x="882" y="337" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLD</text>
        <text x="924" y="356" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Google Cloud</text>
        <text x="924" y="372" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Storage Buckets</text>

        <!-- Legend strip -->
        <line x1="40" y1="424" x2="984" y2="424" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="440" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="456" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <text x="60" y="464" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal API</text>

        <rect x="140" y="456" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="160" y="464" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Core Component</text>

        <rect x="280" y="456" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="300" y="464" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Security / Rules</text>

        <rect x="420" y="456" width="14" height="10" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="440" y="464" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Cloud Provider</text>

        <rect x="560" y="456" width="14" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <text x="580" y="464" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">External Input</text>

        <line x1="680" y1="462" x2="708" y2="462" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="716" y="464" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">HTTP / API</text>

        <line x1="800" y1="462" x2="828" y2="462" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="836" y="464" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Primary Flow</text>
      </svg>
  </div>
</body>
</html>
